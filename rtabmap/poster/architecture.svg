<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrG" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9a9a90"/>
    </marker>
    <marker id="arrB" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#2b5cd0"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="1800" height="1000" fill="#fdfdfb"/>

  <!-- Legend -->
  <line x1="86" y1="408" x2="114" y2="408" stroke="#9a9a90" stroke-width="2.5"/>
  <text x="124" y="413" font-size="14" fill="#85857c">existing</text>
  <line x1="86" y1="440" x2="114" y2="440" stroke="#2b5cd0" stroke-width="2.5"/>
  <text x="124" y="445" font-size="14" fill="#6b82b8">new</text>

  <!-- ===================== AI layer (top) ===================== -->
  <rect x="770" y="60" width="980" height="400" rx="24" fill="#eef4fe" stroke="#d4e1f8" stroke-width="1.5"/>
  <text x="806" y="102" font-size="13" font-weight="600" letter-spacing="2.5" fill="#2b5cd0">AI INDEX</text>

  <!-- Gemini worker -->
  <rect x="830" y="140" width="400" height="270" rx="16" fill="#ffffff" stroke="#ccdaf4" stroke-width="1.5" filter="url(#soft)"/>
  <text x="856" y="182" font-size="23" font-weight="700" fill="#26261f">Gemini</text>

  <rect x="856" y="200" width="348" height="42" rx="21" fill="#f5f9ff" stroke="#cbdbf7"/>
  <text x="1030" y="227" text-anchor="middle" font-size="15" fill="#26261f">walk video &#8594; completed tasks</text>
  <rect x="856" y="254" width="348" height="42" rx="21" fill="#f5f9ff" stroke="#cbdbf7"/>
  <text x="1030" y="281" text-anchor="middle" font-size="15" fill="#26261f">texture atlas &#8594; places</text>
  <rect x="856" y="308" width="348" height="42" rx="21" fill="#f5f9ff" stroke="#cbdbf7"/>
  <text x="1030" y="335" text-anchor="middle" font-size="15" fill="#26261f">titles + notes &#8594; embeddings</text>

  <text x="1030" y="388" text-anchor="middle" font-size="12.5" fill="#85857c" font-family="SF Mono, Menlo, monospace">tasks.jsonl &#183; index.jsonl</text>

  <!-- Search -->
  <rect x="1500" y="190" width="180" height="120" rx="16" fill="#ffffff" stroke="#ccdaf4" stroke-width="1.5" filter="url(#soft)"/>
  <text x="1590" y="242" text-anchor="middle" font-size="18" font-weight="700" fill="#26261f" font-family="SF Mono, Menlo, monospace">/search</text>
  <text x="1590" y="272" text-anchor="middle" font-size="13.5" fill="#85857c">vector + lexical</text>

  <line x1="1238" y1="250" x2="1492" y2="250" stroke="#2b5cd0" stroke-width="2" marker-end="url(#arrB)"/>

  <!-- ===================== Mapping pipeline (base) ===================== -->
  <rect x="50" y="540" width="1700" height="410" rx="24" fill="#f5f5f1" stroke="#e5e5de" stroke-width="1.5"/>
  <text x="86" y="582" font-size="13" font-weight="600" letter-spacing="2.5" fill="#8b8b80">MAPPING PIPELINE</text>

  <!-- Phones -->
  <rect x="100" y="640" width="230" height="250" rx="16" fill="#ffffff" stroke="#dedcd2" stroke-width="1.5" filter="url(#soft)"/>
  <rect x="147" y="672" width="62" height="126" rx="12" fill="#fbfbf8" stroke="#26261f" stroke-width="2"/>
  <rect x="166" y="681" width="24" height="5" rx="2.5" fill="#26261f"/>
  <rect x="225" y="688" width="62" height="126" rx="12" fill="#fbfbf8" stroke="#26261f" stroke-width="2"/>
  <rect x="244" y="697" width="24" height="5" rx="2.5" fill="#26261f"/>
  <text x="215" y="845" text-anchor="middle" font-size="19" font-weight="700" fill="#26261f">iPhones</text>
  <text x="215" y="869" text-anchor="middle" font-size="13.5" fill="#85857c">ARKit &#183; RTAB-Map</text>

  <text x="373" y="737" text-anchor="middle" font-size="12" fill="#85857c">node deltas</text>
  <text x="373" y="753" text-anchor="middle" font-size="12" fill="#85857c">pose &#183; video</text>
  <line x1="336" y1="765" x2="410" y2="765" stroke="#9a9a90" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- Server -->
  <rect x="420" y="615" width="350" height="290" rx="16" fill="#ffffff" stroke="#dedcd2" stroke-width="1.5" filter="url(#soft)"/>
  <text x="445" y="652" font-size="21" font-weight="700" fill="#26261f">collab server</text>
  <rect x="445" y="672" width="300" height="42" rx="21" fill="#fbfbf8" stroke="#e0e0d8"/>
  <text x="595" y="699" text-anchor="middle" font-size="15" fill="#26261f">tag lock &#183; one frame</text>
  <rect x="445" y="726" width="300" height="42" rx="21" fill="#fbfbf8" stroke="#e0e0d8"/>
  <text x="595" y="753" text-anchor="middle" font-size="15" fill="#26261f">merge + loop closure</text>
  <rect x="445" y="780" width="300" height="42" rx="21" fill="#fbfbf8" stroke="#e0e0d8"/>
  <text x="595" y="807" text-anchor="middle" font-size="15" fill="#26261f">live mesh</text>
  <rect x="445" y="834" width="300" height="42" rx="21" fill="#fbfbf8" stroke="#e0e0d8"/>
  <text x="595" y="861" text-anchor="middle" font-size="15" fill="#26261f">textured bake</text>

  <line x1="774" y1="765" x2="848" y2="765" stroke="#9a9a90" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- Artifacts -->
  <rect x="860" y="655" width="200" height="105" rx="14" fill="#ffffff" stroke="#dedcd2" stroke-width="1.5" filter="url(#soft)"/>
  <text x="960" y="702" text-anchor="middle" font-size="16.5" font-weight="600" fill="#26261f">walk videos</text>
  <text x="960" y="726" text-anchor="middle" font-size="12" fill="#85857c" font-family="SF Mono, Menlo, monospace">mp4</text>

  <rect x="1080" y="655" width="200" height="105" rx="14" fill="#ffffff" stroke="#dedcd2" stroke-width="1.5" filter="url(#soft)"/>
  <text x="1180" y="702" text-anchor="middle" font-size="16.5" font-weight="600" fill="#26261f">room archive</text>
  <text x="1180" y="726" text-anchor="middle" font-size="12" fill="#85857c" font-family="SF Mono, Menlo, monospace">PLY + atlas</text>

  <rect x="860" y="790" width="200" height="105" rx="14" fill="#ffffff" stroke="#dedcd2" stroke-width="1.5" filter="url(#soft)"/>
  <text x="960" y="837" text-anchor="middle" font-size="16.5" font-weight="600" fill="#26261f">global map</text>
  <text x="960" y="861" text-anchor="middle" font-size="12" fill="#85857c" font-family="SF Mono, Menlo, monospace">map.db</text>

  <rect x="1080" y="790" width="200" height="105" rx="14" fill="#ffffff" stroke="#dedcd2" stroke-width="1.5" filter="url(#soft)"/>
  <text x="1180" y="837" text-anchor="middle" font-size="16.5" font-weight="600" fill="#26261f">current mesh</text>
  <text x="1180" y="861" text-anchor="middle" font-size="12" fill="#85857c" font-family="SF Mono, Menlo, monospace">live + baked</text>

  <line x1="1288" y1="775" x2="1460" y2="775" stroke="#9a9a90" stroke-width="2" marker-end="url(#arrG)"/>

  <!-- Admin -->
  <rect x="1470" y="655" width="240" height="240" rx="16" fill="#ffffff" stroke="#dedcd2" stroke-width="1.5" filter="url(#soft)"/>
  <text x="1590" y="700" text-anchor="middle" font-size="19" font-weight="700" fill="#26261f">admin page</text>
  <rect x="1495" y="724" width="190" height="40" rx="20" fill="#fbfbf8" stroke="#e0e0d8"/>
  <text x="1590" y="749" text-anchor="middle" font-size="14.5" fill="#26261f">live 3D view</text>
  <rect x="1495" y="776" width="190" height="40" rx="20" fill="#fbfbf8" stroke="#e0e0d8"/>
  <text x="1590" y="801" text-anchor="middle" font-size="14.5" fill="#26261f">history + player</text>

  <!-- Cross-layer arrows -->
  <line x1="960" y1="649" x2="960" y2="418" stroke="#2b5cd0" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="974" y="505" font-size="13" fill="#6b82b8">mp4</text>
  <line x1="1180" y1="649" x2="1180" y2="418" stroke="#2b5cd0" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="1194" y="505" font-size="13" fill="#6b82b8">atlas</text>

  <line x1="1590" y1="318" x2="1590" y2="647" stroke="#2b5cd0" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="1604" y="490" font-size="13" fill="#6b82b8">hits</text>
</svg>
